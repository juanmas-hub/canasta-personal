[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canasta-personal"
version = "0.1.0"
description = "Personal grocery basket index from Argentina's public SEPA price data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13,<1.14",
    "dagster-dbt[dbt-core]>=0.29,<0.30",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=1.5,<2.1",
    "httpx>=0.28,<0.29",
    "plotly>=6,<8",
    "pyarrow>=18,<27",
    "pyyaml>=6,<7",
    "streamlit>=1.50,<2",
]

[project.scripts]
canasta = "canasta.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8,<9",
    "ruff>=0.9",
    "sqlfluff>=3.3",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canasta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
