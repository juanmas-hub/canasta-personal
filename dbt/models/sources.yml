version: 2

sources:
  - name: raw
    description: Parquet escrito por la ingesta; una partición por fecha.
    meta:
      external_location: "read_parquet('{{ env_var('CANASTA_DATA_DIR', '../data/raw') }}/{name}/fecha=*/*.parquet', hive_partitioning=true)"
    tables:
      - name: fct_precio_diario
      - name: agg_precio_ean_diario
      - name: sucursales
      - name: comercios

  - name: basket
    description: Canasta activa, escrita desde basket.yml o basket.example.yml.
    meta:
      external_location: "read_parquet('{{ env_var('CANASTA_DATA_DIR', '../data/raw') }}/basket_items.parquet')"
    tables:
      - name: basket_items
